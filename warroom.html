<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACER Board War Room</title>
<style>
  :root{
    --ink:#0f172a;--bg:#ffffff;--panel:#f8fafc;--line:#e5e7eb;--muted:#64748b;
    --bar:#0f172a;--bar2:#1e293b;--accent:#4338ca;--accent2:#6366f1;
    --green:#16a34a;--amber:#d97706;--red:#dc2626;--teal:#0d9488;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.07);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--panel);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:15px}
  .wrap{max-width:1240px;margin:0 auto;padding:0 22px}
  h1,h2,h3,h4{margin:0;letter-spacing:-.01em;line-height:1.2}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--accent)}
  /* top bar */
  .topbar{background:var(--bar);color:#fff;position:sticky;top:0;z-index:50}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.02em}
  .brand .mk{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:13px;font-weight:800}
  .brand small{display:block;font-weight:500;font-size:11px;color:#94a3b8;letter-spacing:.16em;text-transform:uppercase}
  .topright{display:flex;align-items:center;gap:16px;font-size:13px}
  .topright a{color:#cbd5e1;text-decoration:none}
  .topright a:hover{color:#fff}
  .scorepill{display:flex;align-items:center;gap:9px;background:var(--bar2);border:1px solid #334155;padding:6px 12px;border-radius:999px}
  .scorepill b{font-size:16px}
  .dotg{width:8px;height:8px;border-radius:50%}
  /* nav */
  nav.tabs{background:var(--bar2);position:sticky;top:60px;z-index:49;border-bottom:1px solid #334155}
  nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
  nav.tabs button{background:transparent;border:0;color:#94a3b8;font-size:13.5px;font-weight:600;padding:13px 16px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
  nav.tabs button:hover{color:#e2e8f0}
  nav.tabs button.on{color:#fff;border-bottom-color:var(--accent2)}
  main{padding:30px 0 70px}
  .zone{display:none;animation:fade .35s ease}
  .zone.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .zh{margin-bottom:6px}
  .zh h2{font-size:24px;font-weight:800}
  .zh p{color:var(--muted);margin:4px 0 0;font-size:14px;max-width:820px}
  .eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px}
  /* cards + grid */
  .grid{display:grid;gap:16px;margin-top:20px}
  .g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:960px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .card h3{font-size:16px;font-weight:700}
  .kpi .v{font-size:30px;font-weight:800}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .muted{color:var(--muted)}
  .sm{font-size:12.5px}.xs{font-size:11.5px}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
  .t-dept{background:#eef2ff;color:#4338ca}
  .t-cat{background:#f1f5f9;color:#475569}
  .pri-H{background:#fef2f2;color:#b91c1c}.pri-M{background:#fffbeb;color:#b45309}.pri-L{background:#f0fdf4;color:#15803d}
  .light{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px}
  .l-red{color:var(--red)}.l-amber{color:var(--amber)}.l-green{color:var(--green)}
  .l-red .d,.l-amber .d,.l-green .d{width:10px;height:10px;border-radius:50%}
  .l-red .d{background:var(--red)}.l-amber .d{background:var(--amber)}.l-green .d{background:var(--green)}
  .bar{height:7px;border-radius:5px;background:#eef2f7;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:#475569;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .search:focus{outline:2px solid var(--accent2);border-color:transparent}
  .expand{cursor:pointer}
  .qrow{border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;background:#fff}
  .qrow .q{font-weight:600}
  .qrow .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .ans{font-size:13px;color:#334155;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
  .qrow.open .ans{display:block}
  /* director */
  .dcard{cursor:pointer;transition:.15s}
  .dcard:hover{border-color:#c7d2fe;transform:translateY(-1px)}
  .avatar{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto}
  .drow{display:flex;gap:13px;align-items:flex-start}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .pill{font-size:10.5px;font-weight:600;background:#f1f5f9;color:#475569;border-radius:6px;padding:3px 7px}
  .ddetail{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .dcard.open .ddetail{display:block}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px;margin-top:6px}
  .kv b{color:var(--muted);font-weight:600}
  /* heatmap */
  .heat{display:grid;grid-template-columns:70px repeat(3,1fr);gap:5px;margin-top:12px}
  .heat .hc{border-radius:8px;min-height:78px;padding:7px;font-size:11px;position:relative}
  .heat .axl{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
  .hz{font-size:10px;font-weight:700;display:grid;place-items:center;color:#64748b}
  .dotrisk{display:inline-block;width:22px;height:22px;border-radius:6px;color:#fff;font-size:10px;font-weight:800;text-align:center;line-height:22px;margin:2px;cursor:pointer}
  .callout{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:14px 16px;margin-top:14px}
  .list-clean{list-style:none;padding:0;margin:8px 0 0}
  .list-clean li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
  .list-clean li:last-child{border-bottom:0}
  .badge-tc{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .deptitem{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
  .deptitem:last-child{border-bottom:0}
  .stbtn{border:1px solid var(--line);border-radius:7px;font-size:10.5px;font-weight:700;padding:3px 8px;cursor:pointer;background:#fff;white-space:nowrap;min-width:78px;text-align:center}
  .st-todo{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
  .st-partial{color:#b45309;border-color:#fde68a;background:#fffbeb}
  .st-ready{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}
  .foot{color:#94a3b8;font-size:12px;text-align:center;padding:26px 0}
  .ring{--p:0;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#e5e7eb 0);display:grid;place-items:center}
  .ring>div{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
  .ring b{font-size:24px;font-weight:800}
</style>

<script>
/* ============================ DATA ============================ */
var DIRECTORS=[
 {id:'sm',name:'Sunil Mehta',init:'SM',role:'Chairman',bg:'Former CEO, Indian Banks’ Association (IBA); Former MD & CEO, Punjab National Bank',
  expertise:['Banking strategy','Lender relationships','Market acceptance','Execution','Growth'],
  mindset:'He is the banking establishment. He ran a large public-sector bank and led the industry body every bank CEO sits on. He judges the plan by whether banks and issuers will actually use ACER, not by spreadsheets. Relationships and credibility are his currency.',
  focus:'Market acceptance, bank adoption, merchant-banker and issuer pipeline, team execution capability.',
  style:'Consensus-builder who backs people who can execute; relationship-first.',
  appetite:'Growth-oriented, but demands credible, evidenced execution before capital.',
  qs:[
   {q:'Once BLR is live, will banks actually accept and use ACER’s ratings?',cat:'Market',dept:'BD',pri:'H',a:'Show lender-side validation: named banks aware of ACER, any panel-empanelment intent, and the ECAI adoption path once RBI accredits.'},
   {q:'How many lender relationships do we hold at credit-head / CEO level today?',cat:'Sales',dept:'BD',pri:'H',a:'Present a relationship map with named institutions and contact seniority, not a count.'},
   {q:'How many merchant bankers / arrangers are actively referring mandates?',cat:'Sales',dept:'BD',pri:'H',a:'Give active arranger list, referral volume, and concentration among top 3.'},
   {q:'How many issuers are in active discussion, with names and ticket sizes?',cat:'Sales',dept:'BD',pri:'H',a:'A live pipeline document with stage, ticket size and probability, distinct from the 16/month capacity.'},
   {q:'What is the realistic mandate-conversion rate vs the 16/month capacity?',cat:'Execution',dept:'BD',pri:'H',a:'Capacity is the ceiling; show the assumed conversion and the basis for it.'},
   {q:'Why would a mid-corporate pick ACER over CRISIL, CARE or ICRA?',cat:'Competition',dept:'BD',pri:'H',a:'Articulate turnaround, service, pricing and second-rating positioning.'},
   {q:'Do we have any signed MoUs, LOIs or empanelment with banks or arrangers?',cat:'Sales',dept:'BD',pri:'M',a:'List signed instruments; if none, state the plan and timeline to first.'},
   {q:'Is the BD organisation sized and incentivised to reach ₹1,600 Cr/month?',cat:'People',dept:'BD',pri:'M',a:'BD headcount, quota design and incentive linkage to the capacity target.'},
   {q:'How concentrated are we on a handful of merchant-banker relationships?',cat:'Risk',dept:'BD',pri:'M',a:'Show top-3 referral concentration and diversification plan.'},
   {q:'What is the brand-visibility plan pre- and post-BLR?',cat:'Strategy',dept:'Research',pri:'M',a:'Outreach, thought-leadership and market-education plan with budget.'},
   {q:'How do we withstand pricing pressure if incumbents undercut us?',cat:'Competition',dept:'Finance',pri:'M',a:'Fee-floor economics and the service differentiation that protects price.'},
   {q:'Which regions and sectors do we target first, and why?',cat:'Growth',dept:'BD',pri:'M',a:'Prioritised segments with rationale tied to relationships and demand.'},
   {q:'What does the first ₹1 Cr of real BLR revenue look like, and by when?',cat:'Growth',dept:'BD',pri:'H',a:'Name the mandates that make up the first crore and the month.'},
   {q:'What is the plan if bank adoption is slower than assumed?',cat:'Risk',dept:'BD',pri:'H',a:'Slower-adoption scenario with cost levers and revised ramp.'},
   {q:'How are we using board members’ networks to open bank doors?',cat:'Strategy',dept:'BD',pri:'M',a:'Specific introductions requested from the board and their targets.'},
   {q:'What is the team’s track record of actually winning rating mandates?',cat:'Execution',dept:'People',pri:'M',a:'BD leadership pedigree and any mandates won to date.'},
   {q:'What is our differentiated value proposition to lenders and issuers?',cat:'Strategy',dept:'BD',pri:'H',a:'One crisp positioning statement backed by service metrics.'},
   {q:'Show me a pipeline document, not a projection.',cat:'Sales',dept:'BD',pri:'H',a:'CRM export of named opportunities is the evidence to have ready.'},
   {q:'What conversion and ramp did peers like Infomerics and Acuité see early?',cat:'Market',dept:'Research',pri:'L',a:'Benchmarked early-trajectory read-across as a reality check.'},
   {q:'What is our retention/surveillance-renewal expectation on won mandates?',cat:'Growth',dept:'BD',pri:'M',a:'Annuity assumption and renewal logic behind the ASF line.'}
  ]},
 {id:'ac',name:'Ajay Kumar Choudhary',init:'AC',role:'Independent Director',bg:'Former Executive Director, RBI; Chairman, NPCI',
  expertise:['RBI / ECAI','Operational risk','Technology','Cyber & data','Governance'],
  mindset:'The RBI gatekeeper crossed with a national-infrastructure operator. He thinks in systems, controls and process integrity. He assumes things break and asks how you contain the failure. Low tolerance for operational or regulatory sloppiness.',
  focus:'BLR/ECAI licence path, RBI relationship, operational risk, technology, cyber, scalability of operations.',
  style:'Process-driven, evidence-first, asks for the control before the ambition.',
  appetite:'Low on operational and regulatory risk; wants tested controls.',
  qs:[
   {q:'What is the exact status of the RBI ECAI accreditation application?',cat:'Compliance',dept:'Compliance',pri:'H',a:'Filing date, current stage, queries raised, and documented RBI correspondence.'},
   {q:'What is the realistic RBI timeline and what have they signalled?',cat:'Compliance',dept:'Compliance',pri:'H',a:'Honest timeline with the basis; avoid presenting hope as schedule.'},
   {q:'What is our contingency if RBI delays BLR beyond January 2027?',cat:'Risk',dept:'Compliance',pri:'H',a:'Scenario 3 cost-discipline plan; the firm stays solvent on the corpus.'},
   {q:'Have we met every ECAI eligibility criterion, with evidence?',cat:'Compliance',dept:'Compliance',pri:'H',a:'Criterion-by-criterion checklist mapped to evidence.'},
   {q:'What operational-risk controls govern the rating process end to end?',cat:'Operations',dept:'Rating Operations',pri:'H',a:'Documented workflow, maker-checker, committee sign-off, audit trail.'},
   {q:'How robust and automated is the rating IT platform?',cat:'Technology',dept:'IT',pri:'M',a:'Platform, automation level, and manual-dependency risks.'},
   {q:'What is our cyber-security and data-security posture?',cat:'Technology',dept:'IT',pri:'H',a:'Controls, testing cadence, and any external assessment.'},
   {q:'Are business continuity and disaster recovery tested, not just documented?',cat:'Technology',dept:'IT',pri:'M',a:'Last DR test date and result.'},
   {q:'Can operations scale to 16 mandates/month without quality breakdown?',cat:'Execution',dept:'Rating Operations',pri:'H',a:'Analyst capacity math vs throughput and TAT at scale.'},
   {q:'What is analyst capacity and turnaround time per rating today?',cat:'Operations',dept:'Rating Operations',pri:'M',a:'Headcount, cases/analyst, and current TAT.'},
   {q:'How is independence enforced between BD and the rating committee?',cat:'Governance',dept:'Compliance',pri:'H',a:'Information barriers and committee-composition rules.'},
   {q:'What is surveillance capacity as the rated book compounds?',cat:'Operations',dept:'Rating Operations',pri:'M',a:'Surveillance load model as ASF book grows.'},
   {q:'Any open regulatory observations with SEBI or RBI?',cat:'Compliance',dept:'Compliance',pri:'H',a:'Open-items register with status and owner.'},
   {q:'How are operational-risk incidents monitored and escalated to the board?',cat:'Risk',dept:'Rating Operations',pri:'M',a:'Incident framework and board reporting cadence.'},
   {q:'Is the technology investment plan funded within the cost base?',cat:'Technology',dept:'IT',pri:'M',a:'Tech capex/opex line and its place in the ₹5.27 Cr base.'},
   {q:'How are data integrity and audit trails maintained for every rating?',cat:'Technology',dept:'IT',pri:'M',a:'Immutable logging and record-retention policy.'},
   {q:'What third-party and vendor dependencies create operational risk?',cat:'Risk',dept:'IT',pri:'L',a:'Critical-vendor list and concentration.'},
   {q:'Is there a single point of failure in rating operations or leadership?',cat:'Risk',dept:'Rating Operations',pri:'M',a:'Key-person and process SPOF analysis.'},
   {q:'How do we ensure ECAI-grade process rigour from day one of volume?',cat:'Operations',dept:'Rating Operations',pri:'H',a:'Quality gates that scale with volume.'},
   {q:'What is our data-subscription and market-data continuity plan?',cat:'Technology',dept:'IT',pri:'L',a:'Data sources, contracts and fallback.'}
  ]},
 {id:'ms',name:'Dr. M. S. Sahoo',init:'MS',role:'Independent Director',bg:'Former Chairman, IBBI; Former Whole-Time Member, SEBI',
  expertise:['Corporate governance','SEBI / regulation','Board process','Legal framework','Systemic risk'],
  mindset:'He administered regulation itself. He reasons from first principles and incentives, and probes the system, not the slide. He is intolerant of governance and reputation risk because he has seen how fast a rating franchise can be destroyed by process failure.',
  focus:'Governance stress-testing, conflicts of interest, board process, SEBI compliance, disclosure quality, stakeholder interests.',
  style:'Socratic, principled, tests the framework behind the answer.',
  appetite:'Very low on governance and reputational risk.',
  qs:[
   {q:'Have we stress-tested governance against a rating failure or default?',cat:'Governance',dept:'Compliance',pri:'H',a:'A tabletop of a bad rating and the governance response.'},
   {q:'How do we manage the conflict of interest inherent in issuer-pays?',cat:'Governance',dept:'Compliance',pri:'H',a:'Structural separation, committee independence, fee-blind analysis.'},
   {q:'What is the composition and independence of the rating committee?',cat:'Governance',dept:'Rating Operations',pri:'H',a:'Members, external voices and quorum rules.'},
   {q:'Are board processes, minutes and disclosures at regulatory standard?',cat:'Governance',dept:'Compliance',pri:'M',a:'Board calendar, minute quality and disclosure register.'},
   {q:'Which SEBI CRA compliance thresholds are we near or exceeding?',cat:'Compliance',dept:'Compliance',pri:'H',a:'Threshold dashboard incl. ₹25 Cr net worth maintenance.'},
   {q:'What are shareholders and stakeholders not seeing in this plan?',cat:'Governance',dept:'Finance',pri:'H',a:'Name the uncomfortable truths: FD-interest dependence, unproven BLR ramp.'},
   {q:'How do we prevent rating shopping and protect analytical integrity?',cat:'Governance',dept:'Rating Operations',pri:'M',a:'Policy on unaccepted ratings and disclosure.'},
   {q:'What is our policy on analyst rotation and cooling-off?',cat:'People',dept:'HR',pri:'L',a:'Rotation policy vs SEBI norms.'},
   {q:'How is the board informed of material risks between meetings?',cat:'Governance',dept:'Compliance',pri:'M',a:'Interim escalation protocol.'},
   {q:'What reputational safeguards exist as we push rating volume?',cat:'Risk',dept:'Compliance',pri:'H',a:'Quality gate that scales with volume; the Brickwork lesson.'},
   {q:'Is the whistle-blower and internal-controls framework operational?',cat:'Governance',dept:'Compliance',pri:'M',a:'Policy, channel and test of use.'},
   {q:'What exactly happened in the Brickwork case and are we protected?',cat:'Risk',dept:'Compliance',pri:'H',a:'2022 SEBI cancellation over process/disclosure lapses; map our controls against each.'},
   {q:'How do we ensure disclosure quality and timeliness?',cat:'Compliance',dept:'Compliance',pri:'M',a:'Disclosure SLA and review.'},
   {q:'Are related-party transactions and promoter holdings compliant?',cat:'Governance',dept:'Legal',pri:'M',a:'RPT register and promoter-holding compliance (≥26% / cross-holding cap).'},
   {q:'What is the escalation path for a contested or withdrawn rating?',cat:'Operations',dept:'Rating Operations',pri:'M',a:'Appeals and withdrawal procedure.'},
   {q:'How independent is the internal-audit function?',cat:'Governance',dept:'Compliance',pri:'M',a:'Reporting line and scope.'},
   {q:'Does our incentive structure encourage the right analyst behaviour?',cat:'People',dept:'HR',pri:'M',a:'No linkage of analyst pay to fee outcomes.'},
   {q:'How mature is our policy framework versus an established CRA?',cat:'Governance',dept:'Compliance',pri:'M',a:'Policy inventory and gap list.'},
   {q:'What governance conditions should the board attach to approvals?',cat:'Governance',dept:'Compliance',pri:'H',a:'Propose the guardrails: quality gate, cost-discipline trigger, milestone review.'},
   {q:'Who owns rating quality at board level, and how is it measured?',cat:'Governance',dept:'Rating Operations',pri:'M',a:'Quality KPI and board owner.'}
  ]},
 {id:'gg',name:'Dr. Girraj Prasad Gupta',init:'GG',role:'Independent Director',bg:'Former Controller General of Accounts (CGA), Ministry of Finance',
  expertise:['Financial discipline','Budgeting','Accounting controls','Capital allocation','Audit','Public finance'],
  mindset:'The government’s former chief accountant. He wants evidence behind every number and is conservative on spend. He will find the assumption with no history and pull on it until it holds or breaks.',
  focus:'Break-even sensitivity, unproven assumptions, capital allocation, cash runway, cost controls, audit-readiness.',
  style:'Detail-driven; evidence for every figure; variance discipline.',
  appetite:'Conservative; protects capital and demands controls.',
  qs:[
   {q:'Which revenue assumptions have zero historical evidence?',cat:'Finance',dept:'Finance',pri:'H',a:'Be candid: the entire BLR line is a capacity model, not booked; existing sales have only Q1 history.'},
   {q:'How sensitive is break-even to the mandate ramp assumption?',cat:'Finance',dept:'Finance',pri:'H',a:'Show break-even under half-speed ramp vs full capacity.'},
   {q:'What happens to the P&L if BLR revenue is delayed six months?',cat:'Risk',dept:'Finance',pri:'H',a:'Scenario 2/3 output: loss widens toward ₹2.29–2.80 Cr in FY27.'},
   {q:'Is capital allocation optimal given the ₹26 Cr corpus?',cat:'Capital',dept:'Finance',pri:'H',a:'Corpus is largely the SEBI net-worth lock; only ~₹1.9 Cr is drawable.'},
   {q:'How long can we survive with zero BLR revenue?',cat:'Finance',dept:'Finance',pri:'H',a:'~8 months on drawable ₹1.9 Cr at ₹23.3 L/mo burn, before touching the corpus.'},

 s+='<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:12px" id="qbChips">'+cats.map(function(c){return '<span class="chip'+(c===qbCat?' on':'')+'" data-c="'+c+'">'+c+'</span>'}).join('')+'</div>';
 s+='<div style="margin-top:16px" id="qbList"></div>';
 $('#z-qb').innerHTML=s;
 $('#qbSearch').addEventListener('input',function(){qbQuery=this.value.toLowerCase();paintQB()});
 paintQB();
}
function paintQB(){
 var list=allQuestions().filter(function(q){
   var mc=qbCat==='All'||q.cat===qbCat;
   var mq=!qbQuery||(q.q+q.a+q.dept+q.cat+q.who).toLowerCase().indexOf(qbQuery)>=0;
   return mc&&mq;
 });
 var s='<div class="sm muted" style="margin-bottom:10px">'+list.length+' questions</div>';
 list.forEach(function(q){s+='<div class="qrow expand"><div class="q">'+q.q+'</div><div class="meta">'+priTag(q.pri)+'<span class="tag t-dept">'+q.dept+'</span><span class="tag t-cat">'+q.cat+'</span><span class="pill">asked by '+q.who+'</span><span class="xs muted" style="margin-left:auto">ideal answer ▾</span></div><div class="ans"><b>Answer direction:</b> '+q.a+' <span class="badge-tc" style="margin-left:6px">owner: '+q.dept+' · to confirm</span></div></div>'});
 $('#qbList').innerHTML=s;
}

/* ---- EXECUTIVE WAR ROOM ---- */
function renderWar(){
 function block(title,arr,badge,cls){return '<div class="card"><h3>'+title+'</h3><ul class="list-clean">'+arr.map(function(x){return '<li>'+(badge?'<span class="badge-tc">'+badge+'</span> ':'')+x+'</li>'}).join('')+'</ul></div>'}
 var s='<div class="zh"><div class="eyebrow">Final executive war room</div><h2>Before we walk in</h2><p>The single-screen brief: what we can defend, what we cannot, and what the board must decide.</p></div>';
 s+='<div class="grid g2" style="margin-top:20px">';
 s+=block('What we know (defensible)',WARROOM.know,'','');
 s+=block('What we don’t know yet',WARROOM.dontknow,'GAP','');
 s+=block('What needs validation',WARROOM.validate,'VALIDATE','');
 s+=block('Questions we cannot answer yet',WARROOM.cantanswer,'RISK','');
 s+=block('Biggest risks',WARROOM.risks,'','');
 s+=block('Biggest opportunities',WARROOM.opps,'','');
 s+=block('Documents still required',WARROOM.docs,'NEEDED','');
 s+=block('Board decisions required',WARROOM.decisions,'DECISION','');
 s+='</div>';
 s+='<div class="card" style="margin-top:16px"><h3>CEO / management action items before board day</h3><ul class="list-clean">'+WARROOM.ceo.map(function(x,i){return '<li><b style="color:var(--accent)">'+(i+1)+'.</b> '+x+' <span class="badge-tc" style="margin-left:auto">owner &amp; deadline: to confirm</span></li>'}).join('')+'</ul></div>';
 $('#z-war').innerHTML=s;
}

/* ============================ WIRING ============================ */
function show(z){document.querySelectorAll('.zone').forEach(function(el){el.classList.toggle('on',el.dataset.zone===z)});
 document.querySelectorAll('nav.tabs button').forEach(function(b){b.classList.toggle('on',b.dataset.z===z)});window.scrollTo({top:0,behavior:'smooth'})}
document.querySelector('#tabs').addEventListener('click',function(e){var b=e.target.closest('button');if(b)show(b.dataset.z)});

document.addEventListener('click',function(e){
 var dc=e.target.closest('.dcard');if(dc&&!e.target.closest('.qrow')){dc.classList.toggle('open')}
 var qr=e.target.closest('.qrow');if(qr){qr.classList.toggle('open')}
 var st=e.target.closest('.stbtn');if(st){e.stopPropagation();var dp=st.dataset.dp,i=+st.dataset.i;var cur=deptState[dp][i];var nx=cur==='todo'?'partial':cur==='partial'?'ready':'todo';deptState[dp][i]=nx;st.className='stbtn st-'+nx;st.textContent={todo:'To confirm',partial:'In progress',ready:'Ready'}[nx];var p=deptPct(dp),id=dp.replace(/\W/g,'');var db=document.getElementById('db-'+id),dl=document.getElementById('dl-'+id);if(db)db.style.width=p+'%';if(dl)dl.innerHTML='<span class="d"></span>'+p+'%',dl.className='light l-'+lightFor(p);updateScore()}
 var rd=e.target.closest('.dotrisk');if(rd){show('pre');setTimeout(function(){var el=document.getElementById('R'+rd.dataset.ri);if(el){el.scrollIntoView({behavior:'smooth',block:'center'});el.style.boxShadow='0 0 0 3px #c7d2fe';setTimeout(function(){el.style.boxShadow=''},1600)}},60)}
 var pf=e.target.closest('[data-pf]');if(pf){document.querySelectorAll('#preFilters .chip').forEach(function(c){c.classList.toggle('on',c===pf)});var f=pf.dataset.pf;document.querySelectorAll('#riskCards .card').forEach(function(c){var ok=f==='all'||(f==='H'&&c.dataset.prob==='H')||(f==='dept');c.style.display=ok?'':'none'})}
 var qc=e.target.closest('#qbChips .chip');if(qc){qbCat=qc.dataset.c;document.querySelectorAll('#qbChips .chip').forEach(function(c){c.classList.toggle('on',c===qc)});paintQB()}
});

renderDash();renderDir();renderPre();renderDept();renderQB();renderWar();
</script>

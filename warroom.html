<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACER Board War Room</title>
<style>
  :root{
    --ink:#0f172a;--bg:#ffffff;--panel:#f8fafc;--line:#e5e7eb;--muted:#64748b;
    --bar:#0f172a;--bar2:#1e293b;--accent:#4338ca;--accent2:#6366f1;
    --green:#16a34a;--amber:#d97706;--red:#dc2626;--teal:#0d9488;
    --shadow:0 1px 2px rgba(15,23,42,.05),0 8px 24px rgba(15,23,42,.07);
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    color:var(--ink);background:var(--panel);line-height:1.5;-webkit-font-smoothing:antialiased;font-size:15px}
  .wrap{max-width:1240px;margin:0 auto;padding:0 22px}
  h1,h2,h3,h4{margin:0;letter-spacing:-.01em;line-height:1.2}
  .num{font-variant-numeric:tabular-nums}
  a{color:var(--accent)}
  /* top bar */
  .topbar{background:var(--bar);color:#fff;position:sticky;top:0;z-index:50}
  .topbar .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:14px}
  .brand{display:flex;align-items:center;gap:11px;font-weight:800;letter-spacing:.02em}
  .brand .mk{width:30px;height:30px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:grid;place-items:center;font-size:13px;font-weight:800}
  .brand small{display:block;font-weight:500;font-size:11px;color:#94a3b8;letter-spacing:.16em;text-transform:uppercase}
  .topright{display:flex;align-items:center;gap:16px;font-size:13px}
  .topright a{color:#cbd5e1;text-decoration:none}
  .topright a:hover{color:#fff}
  .scorepill{display:flex;align-items:center;gap:9px;background:var(--bar2);border:1px solid #334155;padding:6px 12px;border-radius:999px}
  .scorepill b{font-size:16px}
  .dotg{width:8px;height:8px;border-radius:50%}
  /* nav */
  nav.tabs{background:var(--bar2);position:sticky;top:60px;z-index:49;border-bottom:1px solid #334155}
  nav.tabs .wrap{display:flex;gap:2px;overflow-x:auto}
  nav.tabs button{background:transparent;border:0;color:#94a3b8;font-size:13.5px;font-weight:600;padding:13px 16px;cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent}
  nav.tabs button:hover{color:#e2e8f0}
  nav.tabs button.on{color:#fff;border-bottom-color:var(--accent2)}
  main{padding:30px 0 70px}
  .zone{display:none;animation:fade .35s ease}
  .zone.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .zh{margin-bottom:6px}
  .zh h2{font-size:24px;font-weight:800}
  .zh p{color:var(--muted);margin:4px 0 0;font-size:14px;max-width:820px}
  .eyebrow{text-transform:uppercase;letter-spacing:.15em;font-size:11px;font-weight:700;color:var(--accent);margin-bottom:8px}
  /* cards + grid */
  .grid{display:grid;gap:16px;margin-top:20px}
  .g2{grid-template-columns:repeat(2,1fr)}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
  @media(max-width:960px){.g2,.g3,.g4{grid-template-columns:1fr}}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}
  .card h3{font-size:16px;font-weight:700}
  .kpi .v{font-size:30px;font-weight:800}
  .kpi .l{font-size:12.5px;color:var(--muted);margin-top:2px}
  .muted{color:var(--muted)}
  .sm{font-size:12.5px}.xs{font-size:11.5px}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:6px;letter-spacing:.02em}
  .t-dept{background:#eef2ff;color:#4338ca}
  .t-cat{background:#f1f5f9;color:#475569}
  .pri-H{background:#fef2f2;color:#b91c1c}.pri-M{background:#fffbeb;color:#b45309}.pri-L{background:#f0fdf4;color:#15803d}
  .light{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:12px}
  .l-red{color:var(--red)}.l-amber{color:var(--amber)}.l-green{color:var(--green)}
  .l-red .d,.l-amber .d,.l-green .d{width:10px;height:10px;border-radius:50%}
  .l-red .d{background:var(--red)}.l-amber .d{background:var(--amber)}.l-green .d{background:var(--green)}
  .bar{height:7px;border-radius:5px;background:#eef2f7;overflow:hidden}
  .bar>i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:700}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;font-weight:600;color:#475569;cursor:pointer}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:#fff}
  .search:focus{outline:2px solid var(--accent2);border-color:transparent}
  .expand{cursor:pointer}
  .qrow{border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:9px;background:#fff}
  .qrow .q{font-weight:600}
  .qrow .meta{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px;align-items:center}
  .ans{font-size:13px;color:#334155;margin-top:9px;padding-top:9px;border-top:1px dashed var(--line);display:none}
  .qrow.open .ans{display:block}
  /* director */
  .dcard{cursor:pointer;transition:.15s}
  .dcard:hover{border-color:#c7d2fe;transform:translateY(-1px)}
  .avatar{width:46px;height:46px;border-radius:11px;background:linear-gradient(135deg,#1e293b,#334155);color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;flex:0 0 auto}
  .drow{display:flex;gap:13px;align-items:flex-start}
  .pillrow{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
  .pill{font-size:10.5px;font-weight:600;background:#f1f5f9;color:#475569;border-radius:6px;padding:3px 7px}
  .ddetail{display:none;margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
  .dcard.open .ddetail{display:block}
  .kv{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;font-size:13.5px;margin-top:6px}
  .kv b{color:var(--muted);font-weight:600}
  /* heatmap */
  .heat{display:grid;grid-template-columns:70px repeat(3,1fr);gap:5px;margin-top:12px}
  .heat .hc{border-radius:8px;min-height:78px;padding:7px;font-size:11px;position:relative}
  .heat .axl{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--muted)}
  .hz{font-size:10px;font-weight:700;display:grid;place-items:center;color:#64748b}
  .dotrisk{display:inline-block;width:22px;height:22px;border-radius:6px;color:#fff;font-size:10px;font-weight:800;text-align:center;line-height:22px;margin:2px;cursor:pointer}
  .callout{background:#fff;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:11px;padding:14px 16px;margin-top:14px}
  .list-clean{list-style:none;padding:0;margin:8px 0 0}
  .list-clean li{padding:9px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
  .list-clean li:last-child{border-bottom:0}
  .badge-tc{background:#fff7ed;color:#c2410c;border:1px solid #fed7aa;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;white-space:nowrap}
  .deptitem{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid #f1f5f9;font-size:13px}
  .deptitem:last-child{border-bottom:0}
  .stbtn{border:1px solid var(--line);border-radius:7px;font-size:10.5px;font-weight:700;padding:3px 8px;cursor:pointer;background:#fff;white-space:nowrap;min-width:78px;text-align:center}
  .st-todo{color:#b91c1c;border-color:#fecaca;background:#fef2f2}
  .st-partial{color:#b45309;border-color:#fde68a;background:#fffbeb}
  .st-ready{color:#15803d;border-color:#bbf7d0;background:#f0fdf4}
  .rsrc{font-size:11.5px;color:#64748b;margin-top:12px;border-top:1px dashed var(--line);padding-top:9px;line-height:1.7}
  .rsrc a{color:var(--accent);text-decoration:none;border-bottom:1px solid #c7d2fe}
  .rsrc a:hover{border-bottom-color:var(--accent)}
  .lbl{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px}
  .lbl-off{background:#eef2ff;color:#4338ca}.lbl-int{background:#ecfdf5;color:#047857}.lbl-assm{background:#fff7ed;color:#c2410c}.lbl-der{background:#f1f5f9;color:#475569}.lbl-tc{background:#fef2f2;color:#b91c1c}
  .foot{color:#94a3b8;font-size:12px;text-align:center;padding:26px 0}
  .ring{--p:0;width:104px;height:104px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),#e5e7eb 0);display:grid;place-items:center}
  .ring>div{width:80px;height:80px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center}
  .ring b{font-size:24px;font-weight:800}
</style>

  mindset:'He administered regulation itself. He reasons from first principles and incentives, and probes the system, not the slide. He is intolerant of governance and reputation risk because he has seen how fast a rating franchise can be destroyed by process failure.',

  focus:'Break-even sensitivity, unproven assumptions, capital allocation, cash runway, cost controls, audit-readiness.',
  style:'Detail-driven; evidence for every figure; variance discipline.',
  appetite:'Conservative; protects capital and demands controls.',

   {q:'Which revenue assumptions have zero historical evidence?',cat:'Finance',dept:'Finance',pri:'H',a:'Be candid: the entire BLR line is a capacity model, not booked; existing sales have only Q1 history.'},

   {q:'How long can we survive with zero BLR revenue?',cat:'Finance',dept:'Finance',pri:'H',a:'About 8 months on drawable ₹1.9 Cr at ₹23.3 L/mo burn, before touching the corpus.'},
